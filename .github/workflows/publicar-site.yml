name: Publicar portal

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - catalogo/**
      - scripts/validar.mjs
      - test/**
      - package.json
      - .github/workflows/publicar-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v6
      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validar catálogo antes da publicação
        run: npm run check
      - name: Testar o projeto antes da publicação
        run: npm test
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato do portal
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar artefato
        id: deployment
        uses: actions/deploy-pages@v4
